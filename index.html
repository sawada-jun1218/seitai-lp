<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <section class="hero">
        <div class="hero-inner">
            <h1 class="hero-title">からだとこころを整える整体院</h1>
            <p class="hero-subtitle">あなたの自然な姿勢と笑顔を取り戻すお手伝いをします。</p>
        </div>
    </section>

    <section id="service" class="service section">
        <div class="container">
            <h2 class="section-title">施術内容</h2>
            <div class="service-items">

                <div class="service-item">
                    <img src="img/service1.jpg" alt="全身整体">
                    <h3>全身整体</h3>
                    <p>体の歪みを整え、慢性的な肩こり・腰痛を根本から改善します。</p>
                </div>

                <div class="service-item">
                    <img src="img/service2.jpg" alt="骨盤矯正">
                    <h3>骨盤矯正</h3>
                    <p>出産後や姿勢の崩れをサポート。バランスの取れた体を取り戻します。</p>
                </div>

                <div class="service-item">
                    <img src="img/service3.jpg" alt="リラクゼーション">
                    <h3>リラクゼーション</h3>
                    <p>ストレスや疲労を和らげ、リラックスできる癒しの時間をご提供。</p>
                </div>

            </div>
        </div>
    </section>
</body>
</html>
